<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Execution Plan — AILY</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#FAF8F6}
textarea,input{font-family:'Segoe UI',sans-serif}
@keyframes pulse{0%{width:20%}50%{width:80%}100%{width:20%}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@media print{.no-print{display:none!important}body{background:white}}
</style>
</head>
<body>
<div id="root"></div>
<script>
var h = React.createElement;
var C = {dark:"#2C2420",blush:"#F4B4B2",blushDark:"#e89a98",greige:"#B0A496",greigeDark:"#8a7e72",offwhite:"#FAF8F6",white:"#ffffff",lightGrey:"#f0ede9",midGrey:"#d4cfc9"};
var PROXY = "https://aily-api-proxy.katjaandersen74.workers.dev";
var TODAY = new Date().toLocaleDateString("en-GB");
var YEAR = new Date().getFullYear();

var QUESTIONS = [
  {id:"industry",label:"What industry are you in?",placeholder:"e.g. Law firm, Manufacturing, Finance, Retail..."},
  {id:"aiMaturity",label:"How would you describe your current AI maturity?",placeholder:"e.g. No AI today / Experimenting with ChatGPT / Some tools in production..."},
  {id:"biggestChallenge",label:"What is your single biggest challenge or opportunity right now?",placeholder:"e.g. Too much manual work, losing clients to competitors, scaling operations..."}
];

var STEPS = ["Upload Strategy","Quick Questions","Generating Plan","Your Plan"];

var MAT_LABELS = [
  ["direction","Direction & Strategy"],["knowledge","Knowledge & Training"],
  ["data","Data"],["technology","Technology & Systems"],
  ["governance","Governance & Responsibility"],["results","Results & Progress"]
];

function emptyUC(){return {name:"",tool:"",buy:false,configure:false,build:false,dataSource:"",dataReady:false,dataNeeds:false,dataGap:false,gdpr:false,confidentiality:false,errors:false,security:false,top5:false};}
function emptyAct(){return {action:"",owner:"",deadline:""};}

var defaultPlan = {
  ambition:"",
  maturity:{direction:{score:"",gap:""},knowledge:{score:"",gap:""},data:{score:"",gap:""},technology:{score:"",gap:""},governance:{score:"",gap:""},results:{score:"",gap:""}},
  useCases:{daily:[emptyUC(),emptyUC(),emptyUC()],operational:[emptyUC(),emptyUC(),emptyUC()],strategic:[emptyUC(),emptyUC(),emptyUC()]},
  people:{who:"",changeNarrative:"",communicationPlan:"",leadershipRole:"",quickWin:"",training:{intro:false,prompt:false,toolSpecific:false,leadership:false},adoption:{guidelines:false,champions:false,workshops:false,support:false}},
  success:{after90:"",metrics:{time:false,quality:false,adoption:false,revenue:false,risk:false},baseline:""},
  actions:{days30:[emptyAct(),emptyAct(),emptyAct()],days90:[emptyAct(),emptyAct(),emptyAct()],days180:[emptyAct(),emptyAct(),emptyAct()]}
};

function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

function callProxy(body){
  return fetch(PROXY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(res){
      if(!res.ok){
        return res.text().then(function(t){
          var msg="Worker error "+res.status+": "+t;
          try{var j=JSON.parse(t);if(j.error&&j.error.message)msg=j.error.message;}catch(e){}
          throw new Error(msg);
        });
      }
      return res.json().then(function(json){
        if(json.error)throw new Error("API error: "+JSON.stringify(json.error));
        return json;
      });
    });
}

function extractText(content){
  return (content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text||"";}).join("");
}

function mergePlan(parsed){
  var p = parsed||{};
  var uc = p.useCases||{};
  var pe = p.people||{};
  var su = p.success||{};
  return {
    ambition: p.ambition||"",
    maturity: Object.assign({},defaultPlan.maturity,p.maturity||{}),
    useCases:{
      daily:(uc.daily||[]).map(function(u){return Object.assign({},emptyUC(),u);}),
      operational:(uc.operational||[]).map(function(u){return Object.assign({},emptyUC(),u);}),
      strategic:(uc.strategic||[]).map(function(u){return Object.assign({},emptyUC(),u);})
    },
    people:{
      who:pe.who||"",changeNarrative:pe.changeNarrative||"",
      communicationPlan:pe.communicationPlan||"",leadershipRole:pe.leadershipRole||"",quickWin:pe.quickWin||"",
      training:Object.assign({},defaultPlan.people.training,pe.training||{}),
      adoption:Object.assign({},defaultPlan.people.adoption,pe.adoption||{})
    },
    success:{
      after90:su.after90||"",baseline:su.baseline||"",
      metrics:Object.assign({},defaultPlan.success.metrics,su.metrics||{})
    },
    actions:{
      days30:(p.actions&&p.actions.days30||[]).map(function(a){return Object.assign({},emptyAct(),a);}),
      days90:(p.actions&&p.actions.days90||[]).map(function(a){return Object.assign({},emptyAct(),a);}),
      days180:(p.actions&&p.actions.days180||[]).map(function(a){return Object.assign({},emptyAct(),a);})
    }
  };
}

// UI helpers
function el(tag,props){
  var children = Array.prototype.slice.call(arguments,2);
  return h(tag,props,children.length===1?children[0]:children.length>1?children:undefined);
}

function Field(props){
  var base = {width:"100%",border:"1px solid "+C.midGrey,borderRadius:4,padding:"8px 10px",fontSize:13,color:C.dark,background:C.white,fontFamily:"inherit",resize:props.multi?"vertical":"none"};
  var s = Object.assign({},base,props.style||{});
  if(props.multi) return h("textarea",{value:props.value,onChange:function(e){props.onChange(e.target.value);},placeholder:props.placeholder,style:Object.assign({},s,{minHeight:props.minHeight||72})});
  return h("input",{value:props.value,onChange:function(e){props.onChange(e.target.value);},placeholder:props.placeholder,style:Object.assign({},s,{height:36})});
}

function Check(props){
  return h("label",{style:{display:"flex",alignItems:"center",gap:6,fontSize:12,color:C.dark,cursor:"pointer",marginRight:8,marginBottom:4}},
    h("input",{type:"checkbox",checked:props.checked,onChange:function(e){props.onChange(e.target.checked);},style:{accentColor:C.dark,width:14,height:14}}),
    props.label
  );
}

function SecHead(props){
  return h("div",{style:{background:props.color||C.greige,color:C.white,padding:"10px 16px",fontWeight:700,fontSize:12,letterSpacing:"0.08em",textTransform:"uppercase"}},props.title);
}

function Stepper(props){
  return h("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",marginBottom:32}},
    STEPS.map(function(label,i){
      return h("div",{key:i,style:{display:"flex",alignItems:"center"}},
        h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:4}},
          h("div",{style:{width:32,height:32,borderRadius:"50%",background:i<props.step?C.greige:i===props.step?C.dark:C.midGrey,color:i<=props.step?C.white:C.greigeDark,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:13}},i<props.step?"✓":String(i+1)),
          h("span",{style:{fontSize:11,color:i===props.step?C.dark:C.greigeDark,fontWeight:i===props.step?700:400,whiteSpace:"nowrap"}},label)
        ),
        i<STEPS.length-1?h("div",{style:{width:48,height:2,background:i<props.step?C.greige:C.midGrey,margin:"0 4px",marginBottom:20}}):null
      );
    })
  );
}

function App(){
  var ss = React.useState(0); var step=ss[0],setStep=ss[1];
  var ss2 = React.useState(""); var strategyText=ss2[0],setStrategyText=ss2[1];
  var ss3 = React.useState(""); var fileName=ss3[0],setFileName=ss3[1];
  var ss4 = React.useState({}); var answers=ss4[0],setAnswers=ss4[1];
  var ss5 = React.useState(""); var companyUrl=ss5[0],setCompanyUrl=ss5[1];
  var ss6 = React.useState(false); var loading=ss6[0],setLoading=ss6[1];
  var ss7 = React.useState(""); var loadingMsg=ss7[0],setLoadingMsg=ss7[1];
  var ss8 = React.useState(""); var loadingDetail=ss8[0],setLoadingDetail=ss8[1];
  var ss9 = React.useState(null); var plan=ss9[0],setPlan=ss9[1];
  var ss10 = React.useState(""); var bg=ss10[0],setBg=ss10[1];
  var ss11 = React.useState("plan"); var activeTab=ss11[0],setActiveTab=ss11[1];
  var ss12 = React.useState(""); var company=ss12[0],setCompany=ss12[1];
  var ss13 = React.useState(""); var owner=ss13[0],setOwner=ss13[1];
  var ss14 = React.useState(false); var consented=ss14[0],setConsented=ss14[1];
  var ss15 = React.useState(""); var error=ss15[0],setError=ss15[1];
  var fileRef = React.useRef();

  function handleFile(e){
    var file=e.target.files[0];
    if(!file)return;
    setFileName(file.name);
    setLoading(true);
    var isPptx=file.name.toLowerCase().endsWith(".pptx");
    if(isPptx){
      JSZip.loadAsync(file).then(function(zip){
        var slides=Object.keys(zip.files).filter(function(n){return n.match(/ppt\/slides\/slide[0-9]+\.xml$/);}).sort();
        return Promise.all(slides.map(function(s){
          return zip.files[s].async("string").then(function(xml){
            var m=Array.from(xml.matchAll(/<a:t[^>]*>(.*?)<\/a:t>/g));
            return m.map(function(x){return x[1];}).join(" ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">");
          });
        }));
      }).then(function(texts){
        var raw=texts.filter(function(t){return t.trim();}).join("\n");
        return callProxy({model:"claude-sonnet-4-5",max_tokens:1500,messages:[{role:"user",content:"Summarise the key strategic priorities, goals, challenges from this presentation in max 600 words:\n\n"+raw.slice(0,8000)}]});
      }).then(function(data){
        setStrategyText(extractText(data.content));
        setLoading(false);
      }).catch(function(){
        setStrategyText("Could not extract automatically. Please describe your strategy below.");
        setLoading(false);
      });
    } else {
      var reader=new FileReader();
      reader.onload=function(ev){
        var b64=ev.target.result.split(",")[1];
        callProxy({model:"claude-sonnet-4-5",max_tokens:1500,messages:[{role:"user",content:[
          {type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}},
          {type:"text",text:"Summarise the key strategic priorities, goals, challenges from this document in max 600 words."}
        ]}]}).then(function(data){
          setStrategyText(extractText(data.content));
          setLoading(false);
        }).catch(function(){
          setStrategyText("Could not extract automatically. Please describe your strategy below.");
          setLoading(false);
        });
      };
      reader.readAsDataURL(file);
    }
  }

  function generate(){
    setStep(2);setLoading(true);setError("");
    var stages=[
      ["🔍 Reading your strategy...","Extracting priorities and context"],
      ["🌍 Researching your industry...","Fetching market intelligence and competitor moves"],
      ["💡 Identifying AI opportunities...","Matching use cases to your specific situation"],
      ["🗺️ Building your action plan...","Sequencing 30/90/180 day priorities"],
      ["📚 Writing background paper...","Compiling market research and inspiration"]
    ];
    var si=0;
    setLoadingMsg(stages[0][0]);setLoadingDetail(stages[0][1]);
    var iv=setInterval(function(){si=(si+1)%stages.length;setLoadingMsg(stages[si][0]);setLoadingDetail(stages[si][1]);},4500);

    var ctx="COMPANY: "+(company||"Not specified")+"\nWEBSITE: "+(companyUrl||"Not provided")+"\nSTRATEGY:\n"+strategyText+"\nINDUSTRY: "+(answers.industry||"Infer from strategy")+"\nAI MATURITY: "+(answers.aiMaturity||"Not specified")+"\nBIGGEST CHALLENGE: "+(answers.biggestChallenge||"Not specified")+"\nTODAY: "+TODAY+" (Year: "+YEAR+")";

    var planSys="You are a world-class AI strategy consultant. Write ALL content in English.\n\nUSE CASE RULES:\n- Describe WHAT AI DOES — a capability not a project task\n- CORRECT: 'AI-assisted summarisation of customer emails'\n- WRONG: 'Implement email AI system'\n- Daily=everyday AI work, Operational=process automation, Strategic=competitive advantage\n- Action plan items must be IMPLEMENTATION STEPS not restatements of use cases\n- Use REAL tool names\n- All dates must use year "+YEAR+" or "+(YEAR+1)+"\n\nReturn ONLY valid JSON:\n{\"ambition\":\"string\",\"maturity\":{\"direction\":{\"score\":\"3\",\"gap\":\"string\"},\"knowledge\":{\"score\":\"3\",\"gap\":\"string\"},\"data\":{\"score\":\"3\",\"gap\":\"string\"},\"technology\":{\"score\":\"3\",\"gap\":\"string\"},\"governance\":{\"score\":\"3\",\"gap\":\"string\"},\"results\":{\"score\":\"3\",\"gap\":\"string\"}},\"useCases\":{\"daily\":[{\"name\":\"string\",\"tool\":\"string\",\"buy\":true,\"configure\":false,\"build\":false,\"dataSource\":\"string\",\"dataReady\":true,\"dataNeeds\":false,\"dataGap\":false,\"gdpr\":true,\"confidentiality\":false,\"errors\":false,\"security\":false,\"top5\":true},{\"name\":\"string\",\"tool\":\"string\",\"buy\":false,\"configure\":true,\"build\":false,\"dataSource\":\"string\",\"dataReady\":false,\"dataNeeds\":true,\"dataGap\":false,\"gdpr\":false,\"confidentiality\":true,\"errors\":false,\"security\":false,\"top5\":false},{\"name\":\"string\",\"tool\":\"string\",\"buy\":true,\"configure\":false,\"build\":false,\"dataSource\":\"string\",\"dataReady\":true,\"dataNeeds\":false,\"dataGap\":false,\"gdpr\":true,\"confidentiality\":false,\"errors\":true,\"security\":false,\"top5\":true}],\"operational\":[{\"name\":\"string\",\"tool\":\"string\",\"buy\":false,\"configure\":true,\"build\":false,\"dataSource\":\"string\",\"dataReady\":false,\"dataNeeds\":true,\"dataGap\":false,\"gdpr\":true,\"confidentiality\":true,\"errors\":false,\"security\":false,\"top5\":true},{\"name\":\"string\",\"tool\":\"string\",\"buy\":false,\"configure\":false,\"build\":true,\"dataSource\":\"string\",\"dataReady\":false,\"dataNeeds\":false,\"dataGap\":true,\"gdpr\":false,\"confidentiality\":true,\"errors\":true,\"security\":true,\"top5\":false},{\"name\":\"string\",\"tool\":\"string\",\"buy\":true,\"configure\":false,\"build\":false,\"dataSource\":\"string\",\"dataReady\":true,\"dataNeeds\":false,\"dataGap\":false,\"gdpr\":true,\"confidentiality\":false,\"errors\":false,\"security\":false,\"top5\":true}],\"strategic\":[{\"name\":\"string\",\"tool\":\"string\",\"buy\":false,\"configure\":false,\"build\":true,\"dataSource\":\"string\",\"dataReady\":false,\"dataNeeds\":false,\"dataGap\":true,\"gdpr\":false,\"confidentiality\":true,\"errors\":true,\"security\":true,\"top5\":true},{\"name\":\"string\",\"tool\":\"string\",\"buy\":false,\"configure\":true,\"build\":false,\"dataSource\":\"string\",\"dataReady\":false,\"dataNeeds\":true,\"dataGap\":false,\"gdpr\":true,\"confidentiality\":false,\"errors\":false,\"security\":false,\"top5\":false},{\"name\":\"string\",\"tool\":\"string\",\"buy\":true,\"configure\":false,\"build\":false,\"dataSource\":\"string\",\"dataReady\":true,\"dataNeeds\":false,\"dataGap\":false,\"gdpr\":false,\"confidentiality\":true,\"errors\":false,\"security\":false,\"top5\":false}]},\"people\":{\"who\":\"string\",\"changeNarrative\":\"string\",\"communicationPlan\":\"string\",\"leadershipRole\":\"string\",\"quickWin\":\"string\",\"training\":{\"intro\":true,\"prompt\":true,\"toolSpecific\":false,\"leadership\":true},\"adoption\":{\"guidelines\":true,\"champions\":true,\"workshops\":false,\"support\":true}},\"success\":{\"after90\":\"string\",\"metrics\":{\"time\":true,\"quality\":true,\"adoption\":true,\"revenue\":false,\"risk\":false},\"baseline\":\"string\"},\"actions\":{\"days30\":[{\"action\":\"string\",\"owner\":\"string\",\"deadline\":\"DD.MM."+YEAR+"\"},{\"action\":\"string\",\"owner\":\"string\",\"deadline\":\"DD.MM."+YEAR+"\"},{\"action\":\"string\",\"owner\":\"string\",\"deadline\":\"DD.MM."+YEAR+"\"}],\"days90\":[{\"action\":\"string\",\"owner\":\"string\",\"deadline\":\"DD.MM."+YEAR+"\"},{\"action\":\"string\",\"owner\":\"string\",\"deadline\":\"DD.MM."+YEAR+"\"},{\"action\":\"string\",\"owner\":\"string\",\"deadline\":\"DD.MM."+YEAR+"\"}],\"days180\":[{\"action\":\"string\",\"owner\":\"string\",\"deadline\":\"DD.MM."+(YEAR+1)+"\"},{\"action\":\"string\",\"owner\":\"string\",\"deadline\":\"DD.MM."+(YEAR+1)+"\"},{\"action\":\"string\",\"owner\":\"string\",\"deadline\":\"DD.MM."+(YEAR+1)+"\"}]}}";

    var bgSys="You are a senior AI market intelligence analyst. Write in English only. Use markdown ## headers and **bold**. Name real companies, tools, statistics.";

    callProxy({model:"claude-sonnet-4-5",max_tokens:5000,tools:[{type:"web_search_20250305",name:"web_search"}],system:planSys,messages:[{role:"user",content:"Research this company and generate a complete AI Execution Plan.\n\n"+ctx}]})
    .then(function(pd){
      var raw=extractText(pd.content);
      var parsed=JSON.parse(raw.replace(/```json|```/g,"").trim());
      setPlan(mergePlan(parsed));
      return sleep(5000);
    })
    .then(function(){
      return callProxy({model:"claude-sonnet-4-5",max_tokens:3000,tools:[{type:"web_search_20250305",name:"web_search"}],system:bgSys,messages:[{role:"user",content:"Write a 700-900 word background intelligence paper.\n\nContext:\n"+ctx+"\n\n## Market & AI Trends\n## The Biggest AI Opportunities\n## Technology Landscape\n## Risks & Governance\n## Why Act Now"}]});
    })
    .then(function(bgd){
      setBg(extractText(bgd.content));
      setStep(3);
      clearInterval(iv);setLoading(false);
    })
    .catch(function(err){
      setError("Error: "+err.message);
      setStep(1);
      clearInterval(iv);setLoading(false);
    });
  }

  function updUC(cat,idx,f,v){
    setPlan(function(p){
      var ucs=p.useCases[cat].map(function(u,i){return i===idx?Object.assign({},u,{[f]:v}):u;});
      return Object.assign({},p,{useCases:Object.assign({},p.useCases,{[cat]:ucs})});
    });
  }

  function updAct(ph,idx,f,v){
    setPlan(function(p){
      var acts=p.actions[ph].map(function(a,i){return i===idx?Object.assign({},a,{[f]:v}):a;});
      return Object.assign({},p,{actions:Object.assign({},p.actions,{[ph]:acts})});
    });
  }

  function mdToHtml(t){
    return (t||"")
      .replace(/## (.*)/g,"<h3 style='color:"+C.dark+";margin:24px 0 10px;font-size:16px;border-bottom:2px solid "+C.blush+";padding-bottom:6px;font-weight:700'>$1</h3>")
      .replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>")
      .replace(/\n/g,"<br/>");
  }

  // STEP 0
  if(step===0) return h("div",{style:{background:C.offwhite,minHeight:"100vh",padding:32}},
    h("div",{style:{maxWidth:640,margin:"0 auto"}},
      h("div",{style:{marginBottom:24}},
        h("span",{style:{fontSize:11,color:C.greigeDark,letterSpacing:"0.12em",textTransform:"uppercase"}},"aily.dk"),
        h("h1",{style:{fontSize:26,fontWeight:800,color:C.dark,margin:"4px 0 0"}},"AI Execution Plan Generator"),
        h("p",{style:{color:C.greigeDark,fontSize:14,margin:"6px 0 0"}},"Upload your strategy and receive a tailored AI execution plan in minutes.")
      ),
      h(Stepper,{step:0}),
      h("div",{style:{background:C.white,borderRadius:8,padding:32,boxShadow:"0 2px 12px rgba(44,36,32,0.07)"}},
        h("h2",{style:{fontSize:16,fontWeight:700,color:C.dark,marginTop:0,marginBottom:16}},"Step 1 — Upload your strategy"),
        h("div",{onClick:function(){fileRef.current.click();},style:{border:"2px dashed "+C.greige,borderRadius:8,padding:"28px 24px",textAlign:"center",cursor:"pointer",background:C.offwhite,marginBottom:16}},
          h("div",{style:{fontSize:32,marginBottom:8}},"📄"),
          h("div",{style:{fontWeight:600,color:C.dark,fontSize:14}},"Click to upload PDF or PowerPoint"),
          h("div",{style:{fontSize:12,color:C.greigeDark,marginTop:4}},"Accepts .pdf and .pptx"),
          fileName?h("div",{style:{marginTop:10,color:C.blushDark,fontWeight:600,fontSize:13}},"✓ "+fileName):null
        ),
        h("input",{ref:fileRef,type:"file",accept:".pdf,.pptx",onChange:handleFile,style:{display:"none"}}),
        loading?h("div",{style:{color:C.greigeDark,fontSize:13,marginBottom:12,textAlign:"center"}},"⏳ Reading document..."):null,
        h("div",{style:{marginBottom:16}},
          h("label",{style:{fontSize:13,fontWeight:600,color:C.dark,display:"block",marginBottom:6}},"Or describe your strategy here:"),
          h("textarea",{value:strategyText,onChange:function(e){setStrategyText(e.target.value);},placeholder:"Paste or type your key strategic priorities, goals, challenges...",style:{width:"100%",minHeight:120,border:"1px solid "+C.midGrey,borderRadius:6,padding:"10px 12px",fontSize:13,color:C.dark,fontFamily:"inherit",resize:"vertical"}})
        ),
        h("div",{style:{display:"flex",gap:12,marginBottom:16}},
          h("div",{style:{flex:1}},
            h("label",{style:{fontSize:12,fontWeight:600,color:C.dark,display:"block",marginBottom:4}},"Company name"),
            h("input",{value:company,onChange:function(e){setCompany(e.target.value);},placeholder:"Acme A/S",style:{width:"100%",border:"1px solid "+C.midGrey,borderRadius:4,padding:"8px 10px",fontSize:13}})
          ),
          h("div",{style:{flex:1}},
            h("label",{style:{fontSize:12,fontWeight:600,color:C.dark,display:"block",marginBottom:4}},"Owner / Contact"),
            h("input",{value:owner,onChange:function(e){setOwner(e.target.value);},placeholder:"Your name",style:{width:"100%",border:"1px solid "+C.midGrey,borderRadius:4,padding:"8px 10px",fontSize:13}})
          )
        ),
        h("div",{style:{marginBottom:16}},
          h("label",{style:{fontSize:12,fontWeight:600,color:C.dark,display:"block",marginBottom:4}},
            "Company website ",
            h("span",{style:{fontWeight:400,color:C.greigeDark}},"(optional — helps us research your context)")
          ),
          h("input",{value:companyUrl,onChange:function(e){setCompanyUrl(e.target.value);},placeholder:"https://www.yourcompany.com",style:{width:"100%",border:"1px solid "+C.midGrey,borderRadius:4,padding:"8px 10px",fontSize:13}})
        ),
        h("div",{style:{background:C.lightGrey,borderRadius:8,padding:"14px 16px",border:"1px solid "+C.midGrey,marginBottom:16}},
          h("div",{style:{display:"flex",gap:10,alignItems:"flex-start"}},
            h("input",{type:"checkbox",id:"consent",checked:consented,onChange:function(e){setConsented(e.target.checked);},style:{accentColor:C.dark,width:16,height:16,marginTop:2,flexShrink:0}}),
            h("label",{htmlFor:"consent",style:{fontSize:12,color:C.dark,lineHeight:1.6,cursor:"pointer"}},
              h("strong",null,"Privacy notice:"),
              " Your document is sent to Anthropic's API for processing. It is ",
              h("strong",null,"not stored by AILY"),
              ". Anthropic does not use API data for model training."
            )
          ),
          h("div",{style:{marginTop:8,paddingLeft:26,fontSize:11,color:C.greigeDark}},"🔒 No data stored by AILY · Session only · Processed via Anthropic API")
        ),
        error?h("div",{style:{marginBottom:12,background:"#fde8e8",border:"1px solid #f4b4b2",borderRadius:6,padding:"10px 14px",fontSize:12,color:"#8b0000"}},"⚠️ "+error):null,

                ),
                h("div",null,
                  h("label",{style:{fontSize:11,fontWeight:700,color:C.greigeDark,textTransform:"uppercase",letterSpacing:"0.06em",display:"block",marginBottom:8}},"Baseline / Starting point"),

          // Action Plan
          h("div",{style:{background:C.white,borderRadius:8,overflow:"hidden",boxShadow:"0 1px 8px rgba(44,36,32,0.07)",marginBottom:24}},
