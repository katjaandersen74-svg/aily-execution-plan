<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Execution Plan — AILY</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #FAF8F6; }
  textarea, input { font-family: 'Segoe UI', sans-serif; }
  @keyframes pulse { 0%{width:20%} 50%{width:80%} 100%{width:20%} }
  .pulse { animation: pulse 1.5s infinite; }
  @media print {
    .no-print { display: none !important; }
    body { background: white; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;

const C = {
  dark: "#2C2420", blush: "#F4B4B2", blushDark: "#e89a98",
  greige: "#B0A496", greigeDark: "#8a7e72", offwhite: "#FAF8F6",
  white: "#ffffff", lightGrey: "#f0ede9", midGrey: "#d4cfc9",
};

const PROXY = "https://aily-api-proxy.katjaandersen74.workers.dev";

const QUESTIONS = [
  { id: "industry", label: "What industry are you in?", placeholder: "e.g. Law firm, Manufacturing, Finance, Retail..." },
  { id: "size", label: "How large is your organisation?", placeholder: "e.g. 50 employees, 500 employees..." },
  { id: "aiMaturity", label: "How would you describe your current AI maturity?", placeholder: "e.g. We use no AI today / We experiment with ChatGPT / We have some tools in production..." },
  { id: "urgency", label: "What is your urgency for AI action?", placeholder: "e.g. We need quick wins in 3 months / We are planning a 1-year transformation..." },
  { id: "budget", label: "What is your appetite for investment?", placeholder: "e.g. Low – existing tools only / Medium – willing to buy tools / High – open to custom builds..." },
  { id: "biggestChallenge", label: "What is your single biggest challenge today?", placeholder: "e.g. Too much manual work, losing clients to competitors, lack of data quality..." },
];

const STEPS = ["Upload Strategy", "Quick Questions", "Generating Plan", "Your Plan"];

const defaultPlan = {
  ambition: "",
  maturity: {
    retning: { score: "", gap: "" }, viden: { score: "", gap: "" },
    data: { score: "", gap: "" }, teknologi: { score: "", gap: "" },
    governance: { score: "", gap: "" }, resultater: { score: "", gap: "" },
  },
  useCases: {
    daily: Array(3).fill(null).map(() => ({ name:"",tool:"",buy:false,configure:false,build:false,dataSource:"",dataReady:false,dataNeeds:false,dataGap:false,gdpr:false,confidentiality:false,errors:false,security:false,top5:false })),
    operational: Array(3).fill(null).map(() => ({ name:"",tool:"",buy:false,configure:false,build:false,dataSource:"",dataReady:false,dataNeeds:false,dataGap:false,gdpr:false,confidentiality:false,errors:false,security:false,top5:false })),
    strategic: Array(3).fill(null).map(() => ({ name:"",tool:"",buy:false,configure:false,build:false,dataSource:"",dataReady:false,dataNeeds:false,dataGap:false,gdpr:false,confidentiality:false,errors:false,security:false,top5:false })),
  },
  people: { who:"", training:{intro:false,prompt:false,toolSpecific:false,leadership:false}, adoption:{guidelines:false,champions:false,workshops:false,support:false} },
  success: { after90:"", metrics:{time:false,quality:false,adoption:false,revenue:false,risk:false}, baseline:"" },
  actions: {
    days30: Array(3).fill(null).map(()=>({action:"",owner:"",deadline:""})),
    days90: Array(3).fill(null).map(()=>({action:"",owner:"",deadline:""})),
    days180: Array(3).fill(null).map(()=>({action:"",owner:"",deadline:""})),
  }
};

function Stepper({ step }) {
  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:0,marginBottom:32}}>
      {STEPS.map((label,i) => (
        <div key={i} style={{display:"flex",alignItems:"center"}}>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
            <div style={{width:32,height:32,borderRadius:"50%",background:i<step?C.greige:i===step?C.dark:C.midGrey,color:i<=step?C.white:C.greigeDark,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:13}}>
              {i<step?"✓":i+1}
            </div>
            <span style={{fontSize:11,color:i===step?C.dark:C.greigeDark,fontWeight:i===step?700:400,whiteSpace:"nowrap"}}>{label}</span>
          </div>
          {i<STEPS.length-1 && <div style={{width:48,height:2,background:i<step?C.greige:C.midGrey,margin:"0 4px",marginBottom:20}}/>}
        </div>
      ))}
    </div>
  );
}

function Field({value,onChange,multi,placeholder,style={}}) {
  const base = {width:"100%",border:`1px solid ${C.midGrey}`,borderRadius:4,padding:"8px 10px",fontSize:13,color:C.dark,background:C.white,fontFamily:"inherit",resize:multi?"vertical":"none",...style};
  return multi
    ? <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{...base,minHeight:64}}/>
    : <input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{...base,height:36}}/>;
}

function Check({label,checked,onChange}) {
  return (
    <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:C.dark,cursor:"pointer",marginRight:8}}>
      <input type="checkbox" checked={checked} onChange={e=>onChange(e.target.checked)} style={{accentColor:C.dark,width:14,height:14}}/>
      {label}
    </label>
  );
}

function SecHead({title,color}) {
  return <div style={{background:color||C.greige,color:C.white,padding:"8px 16px",fontWeight:700,fontSize:12,letterSpacing:"0.08em",textTransform:"uppercase"}}>{title}</div>;
}

function App() {
  const [step, setStep] = useState(0);
  const [strategyText, setStrategyText] = useState("");
  const [fileName, setFileName] = useState("");
  const [answers, setAnswers] = useState({});
  const [loading, setLoading] = useState(false);
  const [loadingMsg, setLoadingMsg] = useState("");
  const [plan, setPlan] = useState(null);
  const [bg, setBg] = useState("");
  const [activeTab, setActiveTab] = useState("plan");
  const [company, setCompany] = useState("");
  const [owner, setOwner] = useState("");
  const [consented, setConsented] = useState(false);
  const [error, setError] = useState("");
  const fileRef = useRef();

  const callProxy = async (body) => {
    let res;
    try {
      res = await fetch(PROXY, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(body)
      });
    } catch(e) { throw new Error("Network error — cannot reach Worker: "+e.message); }
    if (!res.ok) { const t=await res.text().catch(()=>""); throw new Error(`Worker error ${res.status}: ${t}`); }
    const json = await res.json().catch(()=>{throw new Error("Invalid JSON from Worker");});
    if (json.error) throw new Error("Anthropic error: "+JSON.stringify(json.error));
    return json;
  };

  const extractPptx = async (file) => {
    const zip = await JSZip.loadAsync(file);
    const slides = Object.keys(zip.files).filter(n=>n.match(/ppt\/slides\/slide[0-9]+\.xml$/)).sort();
    let text = "";
    for (const s of slides) {
      const xml = await zip.files[s].async("string");
      const matches = [...xml.matchAll(/<a:t[^>]*>(.*?)<\/a:t>/g)];
      const t = matches.map(m=>m[1]).join(" ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">");
      if (t.trim()) text += t.trim()+"\n";
    }
    return text.trim();
  };

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setFileName(file.name);
    setLoading(true);
    setLoadingMsg("Reading your document...");
    const isPptx = file.name.toLowerCase().endsWith(".pptx");
    try {
      if (isPptx) {
        const raw = await extractPptx(file);
        const data = await callProxy({
          model:"claude-sonnet-4-20250514", max_tokens:1000,
          messages:[{role:"user",content:`Summarise the key strategic priorities, goals, challenges from this presentation in max 400 words:\n\n${raw.slice(0,6000)}`}]
        });
        setStrategyText(data.content?.map(b=>b.text||"").join("\n")||"");
      } else {
        const reader = new FileReader();
        reader.onload = async (ev) => {
          const b64 = ev.target.result.split(",")[1];
          try {
            const data = await callProxy({
              model:"claude-sonnet-4-20250514", max_tokens:1000,
              messages:[{role:"user",content:[
                {type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}},
                {type:"text",text:"Summarise the key strategic priorities, goals, challenges from this document in max 400 words."}
              ]}]
            });
            setStrategyText(data.content?.map(b=>b.text||"").join("\n")||"");
          } catch(err) { setStrategyText("Could not extract automatically. Please describe your strategy below."); }
          setLoading(false);
        };
        reader.readAsDataURL(file);
        return;
      }
    } catch(err) { setStrategyText("Could not extract automatically. Please describe your strategy below."); }
    setLoading(false);
  };

  const generate = async () => {
    setStep(2); setLoading(true); setError("");
    const msgs = ["Researching your market...","Identifying AI use cases...","Designing your action plan...","Writing background paper..."];
    let mi = 0; setLoadingMsg(msgs[0]);
    const iv = setInterval(()=>{ mi=(mi+1)%msgs.length; setLoadingMsg(msgs[mi]); },3500);
    const ctx = `STRATEGY: ${strategyText}\nINDUSTRY: ${answers.industry||"?"}\nSIZE: ${answers.size||"?"}\nAI MATURITY: ${answers.aiMaturity||"?"}\nURGENCY: ${answers.urgency||"?"}\nBUDGET: ${answers.budget||"?"}\nCHALLENGE: ${answers.biggestChallenge||"?"}`;
    try {
      const pd = await callProxy({
        model:"claude-sonnet-4-20250514", max_tokens:1000,
        system:`You are an expert AI strategy consultant. Return ONLY valid JSON, no markdown. Structure:
{"ambition":"string","maturity":{"retning":{"score":"2","gap":"string"},"viden":{"score":"2","gap":"string"},"data":{"score":"2","gap":"string"},"teknologi":{"score":"2","gap":"string"},"governance":{"score":"2","gap":"string"},"resultater":{"score":"2","gap":"string"}},"useCases":{"daily":[{"name":"string","tool":"string","buy":true,"configure":false,"build":false,"dataSource":"string","dataReady":true,"dataNeeds":false,"dataGap":false,"gdpr":true,"confidentiality":false,"errors":false,"security":false,"top5":true},{"name":"string","tool":"string","buy":true,"configure":false,"build":false,"dataSource":"string","dataReady":true,"dataNeeds":false,"dataGap":false,"gdpr":false,"confidentiality":false,"errors":false,"security":false,"top5":false},{"name":"string","tool":"string","buy":false,"configure":true,"build":false,"dataSource":"string","dataReady":false,"dataNeeds":true,"dataGap":false,"gdpr":true,"confidentiality":false,"errors":true,"security":false,"top5":true}],"operational":[{"name":"string","tool":"string","buy":false,"configure":true,"build":false,"dataSource":"string","dataReady":false,"dataNeeds":true,"dataGap":false,"gdpr":true,"confidentiality":true,"errors":false,"security":false,"top5":true},{"name":"string","tool":"string","buy":false,"configure":true,"build":false,"dataSource":"string","dataReady":true,"dataNeeds":false,"dataGap":false,"gdpr":false,"confidentiality":true,"errors":true,"security":false,"top5":false},{"name":"string","tool":"string","buy":false,"configure":false,"build":true,"dataSource":"string","dataReady":false,"dataNeeds":false,"dataGap":true,"gdpr":true,"confidentiality":false,"errors":false,"security":true,"top5":true}],"strategic":[{"name":"string","tool":"string","buy":false,"configure":false,"build":true,"dataSource":"string","dataReady":false,"dataNeeds":false,"dataGap":true,"gdpr":false,"confidentiality":true,"errors":true,"security":true,"top5":false},{"name":"string","tool":"string","buy":false,"configure":true,"build":false,"dataSource":"string","dataReady":false,"dataNeeds":true,"dataGap":false,"gdpr":true,"confidentiality":false,"errors":false,"security":false,"top5":true},{"name":"string","tool":"string","buy":true,"configure":false,"build":false,"dataSource":"string","dataReady":true,"dataNeeds":false,"dataGap":false,"gdpr":false,"confidentiality":true,"errors":true,"security":false,"top5":false}]},"people":{"who":"string","training":{"intro":true,"prompt":true,"toolSpecific":false,"leadership":true},"adoption":{"guidelines":true,"champions":true,"workshops":false,"support":true}},"success":{"after90":"string","metrics":{"time":true,"quality":true,"adoption":true,"revenue":false,"risk":false},"baseline":"string"},"actions":{"days30":[{"action":"string","owner":"string","deadline":"string"},{"action":"string","owner":"string","deadline":"string"},{"action":"string","owner":"string","deadline":"string"}],"days90":[{"action":"string","owner":"string","deadline":"string"},{"action":"string","owner":"string","deadline":"string"},{"action":"string","owner":"string","deadline":"string"}],"days180":[{"action":"string","owner":"string","deadline":"string"},{"action":"string","owner":"string","deadline":"string"},{"action":"string","owner":"string","deadline":"string"}]}}
Be specific. 3 use cases per category. Daily=productivity, Operational=process automation, Strategic=competitive advantage.`,
        messages:[{role:"user",content:ctx}]
      });
      const txt = pd.content?.map(b=>b.text||"").join("")||"{}";
      const parsed = JSON.parse(txt.replace(/```json|```/g,"").trim());
      setPlan({...defaultPlan,...parsed});

      const bgd = await callProxy({
        model:"claude-sonnet-4-20250514", max_tokens:1000,
        system:"You are an expert AI strategy analyst. Write a rich background intelligence paper in markdown. Be concrete, name real tools and vendors, cite real trends. Match the language of the input.",
        messages:[{role:"user",content:`Write a 600-800 word background intelligence paper for this company's AI plan.\nContext: ${ctx}\n\nCover:\n## Market & AI Trends\n## Biggest AI Opportunities\n## Technology Landscape\n## Risks & Governance\n## Why Act Now`}]
      });
      setBg(bgd.content?.map(b=>b.text||"").join("")||"");
      setStep(3);
    } catch(err) {
      setError("Error: "+err.message);
      setStep(1);
    }
    clearInterval(iv); setLoading(false);
  };

  const updUC = (cat,idx,f,v) => setPlan(p=>({...p,useCases:{...p.useCases,[cat]:p.useCases[cat].map((u,i)=>i===idx?{...u,[f]:v}:u)}}));
  const updAct = (ph,idx,f,v) => setPlan(p=>({...p,actions:{...p.actions,[ph]:p.actions[ph].map((a,i)=>i===idx?{...a,[f]:v}:a)}}));

  const mdToHtml = (t) => t
    .replace(/## (.*)/g,`<h3 style="color:${C.dark};margin:20px 0 8px;font-size:15px;border-bottom:2px solid ${C.blush};padding-bottom:4px">$1</h3>`)
    .replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>")
    .replace(/\n/g,"<br/>");

  // STEP 0
  if (step===0) return (
    <div style={{background:C.offwhite,minHeight:"100vh",padding:32}}>
      <div style={{maxWidth:640,margin:"0 auto"}}>
        <div style={{marginBottom:24}}>
          <span style={{fontSize:11,color:C.greigeDark,letterSpacing:"0.12em",textTransform:"uppercase"}}>aily.dk</span>
          <h1 style={{fontSize:26,fontWeight:800,color:C.dark,margin:"4px 0 0"}}>AI Execution Plan Generator</h1>
          <p style={{color:C.greigeDark,fontSize:14,margin:"6px 0 0"}}>Upload your strategy and receive a tailored AI execution plan in minutes.</p>
        </div>
        <Stepper step={0}/>
        <div style={{background:C.white,borderRadius:8,padding:32,boxShadow:"0 2px 12px rgba(44,36,32,0.07)"}}>
          <h2 style={{fontSize:16,fontWeight:700,color:C.dark,marginTop:0,marginBottom:16}}>Step 1 — Upload your strategy</h2>
          <div onClick={()=>fileRef.current.click()} style={{border:`2px dashed ${C.greige}`,borderRadius:8,padding:"28px 24px",textAlign:"center",cursor:"pointer",background:C.offwhite,marginBottom:16}}>
            <div style={{fontSize:28,marginBottom:8}}>📄</div>
            <div style={{fontWeight:600,color:C.dark,fontSize:14}}>Click to upload PDF or PowerPoint</div>
            <div style={{fontSize:12,color:C.greigeDark,marginTop:4}}>Accepts .pdf and .pptx</div>
            {fileName && <div style={{marginTop:10,color:C.blushDark,fontWeight:600,fontSize:13}}>✓ {fileName}</div>}
          </div>
          <input ref={fileRef} type="file" accept=".pdf,.pptx" onChange={handleFile} style={{display:"none"}}/>
          {loading && <div style={{color:C.greigeDark,fontSize:13,marginBottom:12,textAlign:"center"}}>⏳ {loadingMsg}</div>}
          <div style={{marginBottom:16}}>
            <label style={{fontSize:13,fontWeight:600,color:C.dark,display:"block",marginBottom:6}}>Or describe your strategy here:</label>
            <textarea value={strategyText} onChange={e=>setStrategyText(e.target.value)} placeholder="Paste or type your key strategic priorities, goals, challenges..." style={{width:"100%",minHeight:100,border:`1px solid ${C.midGrey}`,borderRadius:6,padding:"10px 12px",fontSize:13,color:C.dark,fontFamily:"inherit",resize:"vertical"}}/>
          </div>
          <div style={{display:"flex",gap:12,marginBottom:16}}>
            <div style={{flex:1}}>
              <label style={{fontSize:12,fontWeight:600,color:C.dark,display:"block",marginBottom:4}}>Company name</label>
              <input value={company} onChange={e=>setCompany(e.target.value)} placeholder="Acme A/S" style={{width:"100%",border:`1px solid ${C.midGrey}`,borderRadius:4,padding:"8px 10px",fontSize:13}}/>
            </div>
            <div style={{flex:1}}>
              <label style={{fontSize:12,fontWeight:600,color:C.dark,display:"block",marginBottom:4}}>Owner</label>
              <input value={owner} onChange={e=>setOwner(e.target.value)} placeholder="Your name" style={{width:"100%",border:`1px solid ${C.midGrey}`,borderRadius:4,padding:"8px 10px",fontSize:13}}/>
            </div>
          </div>
          <div style={{background:C.lightGrey,borderRadius:8,padding:"14px 16px",border:`1px solid ${C.midGrey}`,marginBottom:16}}>
            <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
              <input type="checkbox" id="consent" checked={consented} onChange={e=>setConsented(e.target.checked)} style={{accentColor:C.dark,width:16,height:16,marginTop:2,flexShrink:0}}/>
              <label htmlFor="consent" style={{fontSize:12,color:C.dark,lineHeight:1.6,cursor:"pointer"}}>
                <strong>Privacy notice:</strong> Your document is sent to Anthropic's API for processing. It is <strong>not stored by AILY</strong>. Anthropic does not use API data for training. Do not upload strictly confidential documents without consulting your data policy.
              </label>
            </div>
            <div style={{marginTop:8,paddingLeft:26,fontSize:11,color:C.greigeDark}}>🔒 No data stored by AILY · Session only · Processed via Anthropic API</div>
          </div>
          {error && <div style={{marginBottom:12,background:"#fde8e8",border:"1px solid #f4b4b2",borderRadius:6,padding:"10px 14px",fontSize:12,color:"#8b0000"}}>⚠️ {error}</div>}
          <button onClick={()=>strategyText.trim()&&consented?setStep(1):null} disabled={!strategyText.trim()||!consented}
            style={{background:strategyText.trim()&&consented?C.dark:C.midGrey,color:C.white,border:"none",borderRadius:6,padding:"12px 28px",fontSize:14,fontWeight:700,cursor:strategyText.trim()&&consented?"pointer":"not-allowed",width:"100%"}}>
            Continue →
          </button>
        </div>
      </div>
    </div>
  );

  // STEP 1
  if (step===1) return (
    <div style={{background:C.offwhite,minHeight:"100vh",padding:32}}>
      <div style={{maxWidth:640,margin:"0 auto"}}>
        <div style={{marginBottom:24}}>
          <span style={{fontSize:11,color:C.greigeDark,letterSpacing:"0.12em",textTransform:"uppercase"}}>aily.dk</span>
          <h1 style={{fontSize:26,fontWeight:800,color:C.dark,margin:"4px 0 0"}}>AI Execution Plan Generator</h1>
        </div>
        <Stepper step={1}/>
        <div style={{background:C.white,borderRadius:8,padding:32,boxShadow:"0 2px 12px rgba(44,36,32,0.07)"}}>
          <h2 style={{fontSize:16,fontWeight:700,color:C.dark,marginTop:0,marginBottom:6}}>Step 2 — A few quick questions</h2>
          <p style={{fontSize:13,color:C.greigeDark,marginBottom:20}}>Help us tailor the plan to your specific context.</p>
          {error && <div style={{marginBottom:16,background:"#fde8e8",border:"1px solid #f4b4b2",borderRadius:6,padding:"10px 14px",fontSize:12,color:"#8b0000"}}>⚠️ {error}</div>}
          {QUESTIONS.map(q=>(
            <div key={q.id} style={{marginBottom:16}}>
              <label style={{fontSize:13,fontWeight:600,color:C.dark,display:"block",marginBottom:6}}>{q.label}</label>
              <input value={answers[q.id]||""} onChange={e=>setAnswers(a=>({...a,[q.id]:e.target.value}))} placeholder={q.placeholder}
                style={{width:"100%",border:`1px solid ${C.midGrey}`,borderRadius:4,padding:"9px 12px",fontSize:13,color:C.dark,fontFamily:"inherit"}}/>
            </div>
          ))}
          <div style={{display:"flex",gap:12,marginTop:8}}>
            <button onClick={()=>setStep(0)} style={{background:C.offwhite,color:C.dark,border:`1px solid ${C.midGrey}`,borderRadius:6,padding:"11px 20px",fontSize:13,fontWeight:600,cursor:"pointer"}}>← Back</button>
            <button onClick={generate} style={{flex:1,background:C.dark,color:C.white,border:"none",borderRadius:6,padding:"12px 28px",fontSize:14,fontWeight:700,cursor:"pointer"}}>Generate My AI Execution Plan →</button>
          </div>
        </div>
      </div>
    </div>
  );

  // STEP 2
  if (step===2) return (
    <div style={{background:C.offwhite,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:32}}>
      <div style={{textAlign:"center",maxWidth:440}}>
        <div style={{fontSize:48,marginBottom:16}}>⚡</div>
        <h2 style={{fontSize:20,fontWeight:800,color:C.dark,marginBottom:8}}>Building your AI Execution Plan</h2>
        <p style={{fontSize:14,color:C.greigeDark,marginBottom:24}}>{loadingMsg}</p>
        <div style={{background:C.midGrey,borderRadius:100,height:6,overflow:"hidden"}}>
          <div className="pulse" style={{background:C.blush,height:"100%",borderRadius:100}}/>
        </div>
      </div>
    </div>
  );

  // STEP 3
  if (step===3&&plan) {
    const matLabels = [["retning","Retning & Strategi"],["viden","Viden & Træning"],["data","Data"],["teknologi","Teknologi & Systemer"],["governance","Governance & Ansvar"],["resultater","Resultater & Fremdrift"]];

    const UCRow = ({uc,cat,idx}) => (
      <div style={{borderBottom:`1px solid ${C.lightGrey}`,padding:"10px 0",display:"grid",gridTemplateColumns:"2fr 1.5fr 1.5fr 1.5fr auto",gap:8,alignItems:"start"}}>
        <Field value={uc.name} onChange={v=>updUC(cat,idx,"name",v)} placeholder="Use case..."/>
        <div>
          <Field value={uc.tool} onChange={v=>updUC(cat,idx,"tool",v)} placeholder="Tool"/>
          <div style={{display:"flex",gap:6,marginTop:4,flexWrap:"wrap"}}>
            {["buy","configure","build"].map(o=>(
              <label key={o} style={{fontSize:11,display:"flex",alignItems:"center",gap:3,cursor:"pointer"}}>
                <input type="checkbox" checked={uc[o]} onChange={e=>updUC(cat,idx,o,e.target.checked)} style={{accentColor:C.dark}}/>{o.charAt(0).toUpperCase()+o.slice(1)}
              </label>
            ))}
          </div>
        </div>
        <div>
          <Field value={uc.dataSource} onChange={v=>updUC(cat,idx,"dataSource",v)} placeholder="Data source"/>
          <div style={{display:"flex",gap:4,marginTop:4,flexWrap:"wrap"}}>
            {[["dataReady","Ready"],["dataNeeds","Needs work"],["dataGap","Gap"]].map(([k,l])=>(
              <label key={k} style={{fontSize:11,display:"flex",alignItems:"center",gap:3,cursor:"pointer"}}>
                <input type="checkbox" checked={uc[k]} onChange={e=>updUC(cat,idx,k,e.target.checked)} style={{accentColor:C.dark}}/>{l}
              </label>
            ))}
          </div>
        </div>
        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
          {[["gdpr","GDPR"],["confidentiality","Conf."],["errors","Errors"],["security","Sec."]].map(([k,l])=>(
            <label key={k} style={{fontSize:11,display:"flex",alignItems:"center",gap:3,cursor:"pointer"}}>
              <input type="checkbox" checked={uc[k]} onChange={e=>updUC(cat,idx,k,e.target.checked)} style={{accentColor:C.dark}}/>{l}
            </label>
          ))}
        </div>
        <label style={{cursor:"pointer",fontSize:18,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <input type="checkbox" checked={uc.top5} onChange={e=>updUC(cat,idx,"top5",e.target.checked)} style={{display:"none"}}/>
          <span style={{color:uc.top5?"#e5a800":C.midGrey}}>★</span>
        </label>
      </div>
    );

    return (
      <div style={{background:C.offwhite,minHeight:"100vh"}}>
        {/* Header */}
        <div className="no-print" style={{background:C.dark,color:C.white,padding:"16px 32px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <div style={{fontSize:11,color:C.greige,letterSpacing:"0.1em",textTransform:"uppercase"}}>aily.dk</div>
            <h1 style={{fontSize:20,fontWeight:800,margin:"2px 0 0",color:C.white}}>AI Execution Plan</h1>
            {company&&<div style={{fontSize:12,color:C.greige,marginTop:2}}>{company}{owner?` · ${owner}`:""} · {new Date().toLocaleDateString("en-GB")}</div>}
          </div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setStep(0)} style={{background:"transparent",color:C.greige,border:`1px solid ${C.greige}`,borderRadius:5,padding:"7px 14px",fontSize:12,cursor:"pointer"}}>← Start over</button>
            <button onClick={()=>window.print()} style={{background:C.blush,color:C.dark,border:"none",borderRadius:5,padding:"7px 14px",fontSize:12,fontWeight:700,cursor:"pointer"}}>🖨 Print / Save PDF</button>
          </div>
        </div>

        {/* Tabs */}
        <div className="no-print" style={{background:C.white,borderBottom:`1px solid ${C.midGrey}`,padding:"0 32px",display:"flex"}}>
          {[["plan","📋 AI Execution Plan"],["background","📚 Background Paper"]].map(([id,label])=>(
            <button key={id} onClick={()=>setActiveTab(id)} style={{background:"transparent",border:"none",borderBottom:activeTab===id?`3px solid ${C.dark}`:"3px solid transparent",padding:"14px 20px",fontSize:13,fontWeight:activeTab===id?700:400,color:activeTab===id?C.dark:C.greigeDark,cursor:"pointer"}}>{label}</button>
          ))}
        </div>

        <div style={{maxWidth:1100,margin:"0 auto",padding:"24px 24px 60px"}}>
          {activeTab==="plan"&&<>
            {/* Ambition */}
            <div style={{background:C.white,borderRadius:8,marginBottom:20,overflow:"hidden",boxShadow:"0 1px 6px rgba(44,36,32,0.06)"}}>
              <SecHead title="AI Ambition" color={C.blush}/>
              <div style={{padding:16}}>
                <label style={{fontSize:11,fontWeight:700,color:C.greigeDark,textTransform:"uppercase",letterSpacing:"0.08em",display:"block",marginBottom:8}}>Our AI Ambition</label>
                <textarea value={plan.ambition} onChange={e=>setPlan(p=>({...p,ambition:e.target.value}))}
                  style={{width:"100%",border:`1px solid ${C.midGrey}`,borderRadius:4,padding:"10px 12px",fontSize:14,color:C.dark,fontFamily:"inherit",resize:"vertical",minHeight:60,fontStyle:"italic"}}/>
              </div>
            </div>

            {/* Maturity */}
            <div style={{background:C.white,borderRadius:8,marginBottom:20,overflow:"hidden",boxShadow:"0 1px 6px rgba(44,36,32,0.06)"}}>
              <SecHead title="AI Maturity Assessment" color={C.greige}/>
              <div style={{padding:16,display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
                {matLabels.map(([k,label])=>(
                  <div key={k} style={{background:C.lightGrey,borderRadius:6,padding:12}}>
                    <div style={{fontSize:11,fontWeight:700,color:C.dark,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:8}}>{label}</div>
                    <label style={{fontSize:11,color:C.greigeDark,display:"block",marginBottom:4}}>Score (1-5):</label>
                    <input value={plan.maturity[k]?.score||""} onChange={e=>setPlan(p=>({...p,maturity:{...p.maturity,[k]:{...p.maturity[k],score:e.target.value}}}))}
                      style={{width:"100%",border:`1px solid ${C.midGrey}`,borderRadius:4,padding:"6px 8px",fontSize:13,marginBottom:8}}/>
                    <label style={{fontSize:11,color:C.greigeDark,display:"block",marginBottom:4}}>Biggest gap:</label>
                    <textarea value={plan.maturity[k]?.gap||""} onChange={e=>setPlan(p=>({...p,maturity:{...p.maturity,[k]:{...p.maturity[k],gap:e.target.value}}}))}
                      style={{width:"100%",border:`1px solid ${C.midGrey}`,borderRadius:4,padding:"6px 8px",fontSize:12,fontFamily:"inherit",resize:"vertical",minHeight:48}}/>
                  </div>
                ))}
              </div>
            </div>

            {/* Use Cases */}
            <div style={{background:C.white,borderRadius:8,marginBottom:20,overflow:"hidden",boxShadow:"0 1px 6px rgba(44,36,32,0.06)"}}>
              <SecHead title="Use Cases · Technology · Data · Governance" color={C.greige}/>
              <div style={{padding:"0 16px 16px"}}>
                <div style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1.5fr 1.5fr auto",gap:8,padding:"10px 0 6px",borderBottom:`2px solid ${C.midGrey}`}}>
                  {["Use Case","Technology","Data","Governance","★"].map(h=>(
                    <div key={h} style={{fontSize:11,fontWeight:700,color:C.greigeDark,textTransform:"uppercase",letterSpacing:"0.06em"}}>{h}</div>
                  ))}
                </div>
                {[["daily","Daily Productivity",C.lightGrey],["operational","Operational",C.offwhite],["strategic","Strategic",C.lightGrey]].map(([cat,label,bg])=>(
                  <div key={cat} style={{background:bg}}>
                    <div style={{padding:"6px 0 2px",fontSize:11,fontWeight:800,color:C.greigeDark,textTransform:"uppercase",letterSpacing:"0.1em"}}>{label}</div>
                    {(plan.useCases[cat]||[]).map((uc,idx)=><UCRow key={idx} uc={uc} cat={cat} idx={idx}/>)}
                  </div>
                ))}
              </div>
            </div>

            {/* People & Success */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20,marginBottom:20}}>
              <div style={{background:C.white,borderRadius:8,overflow:"hidden",boxShadow:"0 1px 6px rgba(44,36,32,0.06)"}}>
                <SecHead title="People, Training & Change Management" color={C.greige}/>
                <div style={{padding:16,display:"flex",flexDirection:"column",gap:12}}>
                  <div>
                    <label style={{fontSize:11,fontWeight:700,color:C.greigeDark,textTransform:"uppercase",letterSpacing:"0.06em",display:"block",marginBottom:6}}>Who needs to change how they work?</label>
                    <Field multi value={plan.people?.who||""} onChange={v=>setPlan(p=>({...p,people:{...p.people,who:v}}))} placeholder="Teams and roles..."/>
                  </div>
                  <div>
                    <label style={{fontSize:11,fontWeight:700,color:C.greigeDark,textTransform:"uppercase",letterSpacing:"0.06em",display:"block",marginBottom:6}}>Training</label>
                    <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                      {[["intro","Intro"],["prompt","Prompt Skills"],["toolSpecific","Tool-specific"],["leadership","Leadership"]].map(([k,l])=>(
                        <Check key={k} label={l} checked={plan.people?.training?.[k]||false} onChange={v=>setPlan(p=>({...p,people:{...p.people,training:{...p.people.training,[k]:v}}}))}/>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label style={{fontSize:11,fontWeight:700,color:C.greigeDark,textTransform:"uppercase",letterSpacing:"0.06em",display:"block",marginBottom:6}}>Adoption</label>
                    <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                      {[["guidelines","Guidelines"],["champions","Champions"],["workshops","Workshops"],["support","Support Channel"]].map(([k,l])=>(
                        <Check key={k} label={l} checked={plan.people?.adoption?.[k]||false} onChange={v=>setPlan(p=>({...p,people:{...p.people,adoption:{...p.people.adoption,[k]:v}}}))}/>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
              <div style={{background:C.white,borderRadius:8,overflow:"hidden",boxShadow:"0 1px 6px rgba(44,36,32,0.06)"}}>
                <SecHead title="How We Measure Success" color={C.greige}/>
                <div style={{padding:16,display:"flex",flexDirection:"column",gap:12}}>
                  <div>
                    <label style={{fontSize:11,fontWeight:700,color:C.greigeDark,textTransform:"uppercase",letterSpacing:"0.06em",display:"block",marginBottom:6}}>After 90 days we've succeeded if:</label>
                    <Field multi value={plan.success?.after90||""} onChange={v=>setPlan(p=>({...p,success:{...p.success,after90:v}}))}/>
                  </div>
                  <div>
                    <label style={{fontSize:11,fontWeight:700,color:C.greigeDark,textTransform:"uppercase",letterSpacing:"0.06em",display:"block",marginBottom:6}}>Key Metrics</label>
                    <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                      {[["time","Time saved"],["quality","Quality"],["adoption","Adoption"],["revenue","Revenue"],["risk","Risk"]].map(([k,l])=>(
                        <Check key={k} label={l} checked={plan.success?.metrics?.[k]||false} onChange={v=>setPlan(p=>({...p,success:{...p.success,metrics:{...p.success.metrics,[k]:v}}}))}/>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label style={{fontSize:11,fontWeight:700,color:C.greigeDark,textTransform:"uppercase",letterSpacing:"0.06em",display:"block",marginBottom:6}}>Baseline / Starting point</label>
                    <Field value={plan.success?.baseline||""} onChange={v=>setPlan(p=>({...p,success:{...p.success,baseline:v}}))}/>
                  </div>
                </div>
              </div>
            </div>

            {/* Action Plan */}
            <div style={{background:C.white,borderRadius:8,overflow:"hidden",boxShadow:"0 1px 6px rgba(44,36,32,0.06)",marginBottom:20}}>
              <SecHead title="Action Plan · 30 / 90 / 180 Days" color={C.dark}/>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)"}}>
                {[["days30","30 Days — Quick wins",C.blush],["days90","90 Days — First use cases live",C.greige],["days180","180 Days — Scale & learn",C.dark]].map(([ph,label,col])=>(
                  <div key={ph} style={{borderRight:`1px solid ${C.midGrey}`}}>
                    <div style={{background:col,color:col===C.dark?C.white:C.dark,padding:"8px 14px",fontSize:12,fontWeight:700}}>{label}</div>
                    <div style={{padding:"12px 14px"}}>
                      {(plan.actions[ph]||[]).map((a,idx)=>(
                        <div key={idx} style={{marginBottom:12}}>
                          <div style={{fontSize:11,fontWeight:700,color:C.greigeDark,marginBottom:3}}>{idx+1}.</div>
                          <Field multi value={a.action} onChange={v=>updAct(ph,idx,"action",v)} placeholder="Action..." style={{minHeight:52}}/>
                          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginTop:5}}>
                            <Field value={a.owner} onChange={v=>updAct(ph,idx,"owner",v)} placeholder="Owner"/>
                            <Field value={a.deadline} onChange={v=>updAct(ph,idx,"deadline",v)} placeholder="Deadline"/>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{textAlign:"center",padding:"12px 0",borderTop:`1px solid ${C.midGrey}`,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              <div style={{width:20,height:20,background:C.dark,borderRadius:3,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <span style={{color:C.white,fontSize:9,fontWeight:800}}>A</span>
              </div>
              <span style={{fontSize:11,color:C.greigeDark,fontWeight:600,letterSpacing:"0.1em",textTransform:"uppercase"}}>AILY · aily.dk</span>
            </div>
          </>}

          {activeTab==="background"&&(
            <div style={{background:C.white,borderRadius:8,padding:32,boxShadow:"0 1px 6px rgba(44,36,32,0.06)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,borderBottom:`2px solid ${C.blush}`,paddingBottom:16}}>
                <div>
                  <h2 style={{fontSize:18,fontWeight:800,color:C.dark,margin:0}}>Background Intelligence Paper</h2>
                  <p style={{fontSize:12,color:C.greigeDark,margin:"4px 0 0"}}>Supporting research and market context for your AI Execution Plan</p>
                </div>
                <button className="no-print" onClick={()=>window.print()} style={{background:C.dark,color:C.white,border:"none",borderRadius:5,padding:"8px 16px",fontSize:12,fontWeight:700,cursor:"pointer"}}>🖨 Print</button>
              </div>
              <div style={{fontSize:14,lineHeight:1.8,color:C.dark}} dangerouslySetInnerHTML={{__html:mdToHtml(bg)}}/>
              <div style={{marginTop:32,borderTop:`1px solid ${C.midGrey}`,paddingTop:16,display:"flex",alignItems:"center",gap:6}}>
                <div style={{width:20,height:20,background:C.dark,borderRadius:3,display:"flex",alignItems:"center",justifyContent:"center"}}>
                  <span style={{color:C.white,fontSize:9,fontWeight:800}}>A</span>
                </div>
                <span style={{fontSize:11,color:C.greigeDark,fontWeight:600,letterSpacing:"0.1em",textTransform:"uppercase"}}>AILY · aily.dk</span>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
